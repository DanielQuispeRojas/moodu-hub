# Configuracion de PRODUCCION para el MOODU Hub en hosting (Render/Railway).
# Spring Boot lee este perfil con: --spring.profiles.active=prod
# Render/Railway inyectan las variables DB_HOST, DB_PORT, DB_NAME, DB_USERNAME,
# DB_PASSWORD por separado (desde el servicio de Postgres).

spring.application.name=licencias-server

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

licencias.sitio-web=https://moodu.com

server.port=${PORT:9090}

# Render/Railway maneja HTTPS en el load balancer; la app recibe HTTP interno.
# forward-headers-strategy=native hace que Spring respete X-Forwarded-Proto/Host
# para que request.isSecure() devuelva true y las URLs generadas usen https.
server.forward-headers-strategy=native

# Forzar que en produccion exista un JWT_SECRET real (no el default de dev).
# Si falta, el startup falla con error claro en vez de quedar con un secreto conocido.
