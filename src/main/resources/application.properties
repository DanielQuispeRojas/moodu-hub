server.port=9090

spring.application.name=licencias-server

spring.datasource.url=jdbc:h2:file:./licencias_data/licencias;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CIPHER=AES
spring.datasource.username=sa
spring.datasource.password=moodu-hub moodu-hub

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

licencias.sitio-web=https://moodu.com

# JWT Admin (clave >= 256 bits para HMAC-SHA256)
auth.jwt.secret=${JWT_SECRET:moodu-hub-jwt-secret-key-2026-change-in-production-please}
auth.jwt.expiracion-ms=86400000

# Actuator (health + metrics)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
