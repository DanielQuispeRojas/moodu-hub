# Configuracion de PRODUCCION para el MOODU Hub en hosting (Render/Railway).
# Spring Boot lee este perfil con: --spring.profiles.active=prod
# Render/Railway inyectan DATABASE_URL como variable de entorno en formato
# "postgresql://user:pass@host:port/db". El Dockerfile antepone "jdbc:" y la
# pasa por linea de comando, por eso aqui NO se setea spring.datasource.url.

spring.application.name=licencias-server

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

licencias.sitio-web=https://moodu.com

server.port=${PORT:9090}
