# Configuracion de PRODUCCION para el MOODU Hub en hosting (Render/Railway).
# Spring Boot lee este perfil con: --spring.profiles.active=prod
# Render/Railway inyectan DATABASE_URL como variable de entorno.

spring.application.name=licencias-server

# Render entrega DATABASE_URL en formato: postgres://user:pass@host:port/db
# Spring Boot 2.5+ acepta esa URL directamente con el driver postgresql.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

licencias.sitio-web=https://moodu.com

server.port=${PORT:9090}
