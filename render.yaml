# Render: despliegue del MOODU Hub (licencias-server).
# Este archivo asume que el repo contiene SOLO el licencias-server en su raiz.
services:
  - type: web
    name: moodu-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/catalogo/modulos
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: moodu-hub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: moodu-hub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: moodu-hub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: moodu-hub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: moodu-hub-db
          property: password
      - key: PORT
        value: "9090"

databases:
  - name: moodu-hub-db
    databaseName: moodu_hub
    plan: free
