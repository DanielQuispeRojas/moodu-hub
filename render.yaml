# Render: despliegue del MOODU Hub (licencias-server).
# Este archivo asume que el repo contiene SOLO el licencias-server en su raiz.
services:
  - type: web
    name: moodu-hub
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: moodu-hub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: moodu-hub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: moodu-hub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: moodu-hub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: moodu-hub-db
          property: password
      - key: PORT
        value: "9090"
      # JWT_SECRET: DEBE configurarse como Environment Variable en el dashboard de Render
      # (Secret Files o Environment Variables). NO hardcodear el valor real aqui.
      # Generar con: python3 -c "import secrets; print(secrets.token_hex(48))"
      # o con: openssl rand -hex 48
      # Requisito: >= 32 bytes (256 bits).

databases:
  - name: moodu-hub-db
    databaseName: moodu_hub
    plan: free
